name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web_src/package-lock.json
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true

      # The same script as a local build: npm ci, typecheck, engine bundle,
      # pub get, analyze, test, then the web build. Project Pages live at
      # /gravix-flutter/.
      # `bash build.sh`, not `./build.sh`: Git on Windows does not record the
      # executable bit, so a checkout on the runner may not have it.
      - run: bash build.sh web --base-href /gravix-flutter/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
      - id: deployment
        uses: actions/deploy-pages@v4
